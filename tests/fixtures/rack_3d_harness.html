<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Rack 3D harness</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#07101b}</style></head>
<body><iframe id="rack" src="../../slotting/rack_3d_frontend/index.html"></iframe>
<script>
const frame=document.getElementById('rack'),locations=[];
for(let level=1;level<=5;level++)for(let pos=1;pos<=3;pos++)locations.push({
 id:`RA-P01-B01-LI-N${String(level).padStart(2,'0')}-P${String(pos).padStart(2,'0')}`,
 pasillo:1,bahia:1,lado:'I',nivel:level,posicion:pos,rol:level<=2?'SURTIDO':'EXCESO',
 tipo_codigo:pos===2?'RA 2':'RA 1',x:(pos-1)*1.22,y:0,z:(level-1)*1.76,w:pos===2?.6:1.2,d:1.1,h:1.74,
 longitud_cm:pos===2?60:120,profundidad_cm:110,altura_cm:174,multisku:level===1&&pos===1,
 status:level===1&&pos===2?'ERROR':level>=3?'EXCESO':level===1&&pos===1?'MULTISKU':'VALIDA',
 issues:level===1&&pos===2?['La pieza no entra con ninguna orientación permitida.']:[],
 skus:level===1&&pos===1?[{sku:'697061',existencia:10,unidades_activo:4,unidades_objetivo:4,largo_cm:20,ancho_cm:15,alto_cm:18,abc:'A',capacidad:20,reserva:false},{sku:'624918',existencia:3,unidades_activo:3,unidades_objetivo:3,largo_cm:18,ancho_cm:14,alto_cm:16,abc:'B',capacidad:18,reserva:false}]:level===1&&pos===2?[{sku:'147933',existencia:2,unidades_activo:2,unidades_objetivo:2,largo_cm:130,ancho_cm:60,alto_cm:40,abc:'C',capacidad:0,reserva:false}]:level===3&&pos===1?[{sku:'697061',existencia:10,unidades_activo:4,unidades_objetivo:6,largo_cm:20,ancho_cm:15,alto_cm:18,abc:'A',capacidad:20,reserva:true}]:[]
});
const args={escena:{localidades:locations,ancho:3.64,largo:1.1,altura:8.78},alternativas:{},gap_cm:2,height:780};
const render=()=>frame.contentWindow.postMessage({type:'streamlit:render',args},'*');
window.addEventListener('message',e=>{if(e.data?.type==='streamlit:componentReady')render()});
frame.addEventListener('load',()=>{setTimeout(render,1000);setTimeout(render,3000)});
</script></body></html>
