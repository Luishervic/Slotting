<style>
html,body{margin:0;background:#070b12;color:#e5e7eb;color-scheme:dark;font-family:Inter,system-ui,sans-serif}
button,input,select{background:#111827;color:#e5e7eb;border:1px solid #334155;border-radius:5px;padding:4px 7px}
button:hover{border-color:#38bdf8}
  .workspace{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px;align-items:start}
.canvas{overflow:auto;max-height:640px;border-radius:6px}
.inspector{position:sticky;top:0;max-height:620px;overflow:auto}
.loc-shell{font:13px Inter,system-ui,sans-serif}
.loc-toolbar,.loc-metrics{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.loc-toolbar button.active{background:#0e7490;border-color:#22d3ee}
.loc-grid{display:grid;grid-template-columns:245px minmax(0,1fr) 285px;gap:10px;align-items:start}
.loc-panel{background:#0e1623;border:1px solid #253247;border-radius:7px;padding:9px}
.loc-palette{max-height:650px;overflow:auto}
.type-card{display:block;width:100%;text-align:left;margin:0 0 7px;padding:8px;background:#111827}
.type-card.active{border-color:#22d3ee;background:#12304a}
.type-line{display:flex;justify-content:space-between;gap:8px;align-items:center}
.type-meta,.loc-muted{color:#94a3b8;font-size:12px}
.type-bar{display:block;height:5px;background:#263448;border-radius:4px;margin-top:6px;overflow:hidden}
.type-bar>span{display:block;height:100%;background:#2dd4bf}
.metric-chip{background:#111827;border:1px solid #253247;border-radius:6px;padding:6px 9px}
.metric-chip strong{display:block;font-size:15px}
.loc-canvas{min-height:360px;background:#080d15;border:1px solid #334155;border-radius:7px;overflow:hidden}
.loc-inspector{max-height:650px;overflow:auto}
.loc-inspector label{display:block;margin:7px 0 3px;color:#94a3b8}
.loc-inspector input,.loc-inspector select{width:100%;box-sizing:border-box}
.loc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.loc-error{color:#fca5a5}.loc-ok{color:#6ee7b7}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.inspector{position:static;max-height:none}}
@media(max-width:1050px){.loc-grid{grid-template-columns:210px minmax(0,1fr)}.loc-inspector{grid-column:1/-1;max-height:none}}
@media(max-width:720px){.loc-grid{grid-template-columns:1fr}.loc-palette,.loc-inspector{max-height:none}}
</style>
<div id="cad"></div>
<script src="./konva.min.js"></script>
<script>
const root=document.getElementById('cad'), ns='http://www.w3.org/2000/svg';
let A={},P=[],O=[],E=[],Z=[],U=[],mode='select',drag=null,selected=[],presetW=0,presetD=0,guides={x:null,y:null},polygonDraft=[],incomingFingerprint=null,zoom=1;
let locStage=null,locMode='select',activeType=null,locOrientation='horizontal',runGap=0,runSides=1,aisleWidth=3.5,locZoom=1,locPan={x:0,y:0},locSelected=[],locHistory=[],locFuture=[],locGesture=null;

function post(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');}
// Un vértice puede llegar como {x,y} (dibujado aquí) o como [x,y] (importado
// de un plano CAD o construido en Python). Sin normalizarlo, las zonas
// poligonales importadas se dibujaban con coordenadas `undefined` y quedaban
// invisibles: el dato estaba y no se veía nada.
function vert(p){return Array.isArray(p)?{x:Number(p[0]),y:Number(p[1])}:{x:Number(p?.x),y:Number(p?.y)};}
function verts(l){return (l||[]).map(vert).filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y));}
// Escala de trazo y texto. Todo el dibujo está en METROS, así que en una nave
// de 150 m un texto de 0.55 m mide 3 píxeles y un trazo de 0.08 m desaparece.
// Se agranda proporcionalmente y se deja intacto en naves chicas.
function esc(){return Math.max(1,Math.max(Number(A.ancho)||1,Number(A.largo)||1)/40);}
// Paso VISUAL de la cuadrícula. El imán sigue usando `A.rejilla`; esto es sólo
// lo que se dibuja. Con rejilla de 0.25 m una nave de 150 × 66 m pedía 861
// líneas, que se ven como un bloque gris y tapan el plano entero.
function pasoGrid(){
  const base=Number(A.rejilla)||.25, mayor=Math.max(Number(A.ancho)||1,Number(A.largo)||1);
  return [base,.5,1,2,2.5,5,10,20,25,50].find(p=>p>=base&&mayor/p<=70)||mayor/70;
}
function ready(){post('streamlit:componentReady',{apiVersion:1});}
function emit(){post('streamlit:setComponentValue',{value:{perimetro:P,obstaculos:O,accesos:E,zonas:Z,ubicaciones:U},dataType:'json'});}
function frame(){post('streamlit:setFrameHeight',{height:Math.max(420,document.body.scrollHeight)});}
function snap(n){const g=Number(A.rejilla)||.25;return Math.round(n/g)*g;}
function clamp(p){return {x:Math.max(0,Math.min(Number(A.ancho),p.x)),y:Math.max(0,Math.min(Number(A.largo),p.y))};}
function pt(e,svg){const r=svg.getBoundingClientRect();return clamp({x:snap((e.clientX-r.left)*Number(A.ancho)/r.width),y:snap((r.bottom-e.clientY)*Number(A.largo)/r.height)});}
function add(el,attrs={}){Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return el;}
function list(kind){return kind==='obstacle'?O:kind==='access'?E:kind==='zone'?Z:kind==='slot'?U:P;}
function sid(kind,index,sub=null){return sub===null?`${kind}:${index}`:`${kind}:${index}:${sub}`;}
function isSelected(kind,index,sub=null){return selected.includes(sid(kind,index,sub));}
function getSelection(){return selected.map(s=>{const [kind,n,j]=s.split(':'),index=Number(n),sub=j===undefined?null:Number(j),item=kind==='zoneVertex'?Z[index]?.poligono?.[sub]:list(kind)[index];return {kind,index,sub,item};}).filter(x=>x.item);}
function clearSelection(){selected=[];}
function select(kind,index,additive,sub=null){const key=sid(kind,index,sub);if(additive)selected=selected.includes(key)?selected.filter(x=>x!==key):[...selected,key];else if(!selected.includes(key))selected=[key];}
function colorFor(o){return o.tipo==='drop_mercancia'?'#0369a1':'#b91c1c';}
function csv(v){return Array.isArray(v)?v.join(', '):(v||'');}
function options(values,current,empty='Cualquiera'){return `<option value="">${empty}</option>${(values||[]).map(v=>`<option value="${String(v).replace(/"/g,'&quot;')}" ${String(current||'')===String(v)?'selected':''}>${v}</option>`).join('')}`;}
// Imán: al mover o dibujar, alinea bordes con el lienzo, vértices del
// perímetro y bordes de zonas, elementos y ubicaciones cercanos.
function rectItems(){return [...O.map((v,i)=>({kind:'obstacle',index:i,item:v})),...E.map((v,i)=>({kind:'access',index:i,item:v})),...Z.map((v,i)=>({kind:'zone',index:i,item:v})),...U.map((v,i)=>({kind:'slot',index:i,item:v}))].filter(r=>Number.isFinite(Number(r.item.x))&&Number.isFinite(Number(r.item.y))&&Number.isFinite(Number(r.item.w))&&Number.isFinite(Number(r.item.d)));}
function imantar(records,dx=0,dy=0){
  const moving=new Set(records.map(r=>sid(r.kind,r.index))), tol=Math.min(.35,Math.max(.12,(Number(A.rejilla)||.25)*.9));
  const xedges=[0,Number(A.ancho),...P.map(p=>Number(p.x))], yedges=[0,Number(A.largo),...P.map(p=>Number(p.y))];
  rectItems().filter(r=>!moving.has(sid(r.kind,r.index))).forEach(r=>{xedges.push(Number(r.item.x),Number(r.item.x)+Number(r.item.w));yedges.push(Number(r.item.y),Number(r.item.y)+Number(r.item.d));});
  let bestX=0,bestY=0,scoreX=Infinity,scoreY=Infinity,guideX=null,guideY=null;
  records.forEach(r=>{const v=r.item||list(r.kind)[r.index],x=Number(r.x??v.x)+dx,y=Number(r.y??v.y)+dy,w=Number(v.w),d=Number(v.d);xedges.forEach(e=>[e-x,e-(x+w)].forEach(delta=>{if(Math.abs(delta)<=tol&&Math.abs(delta)<scoreX){scoreX=Math.abs(delta);bestX=delta;guideX=e;}}));yedges.forEach(e=>[e-y,e-(y+d)].forEach(delta=>{if(Math.abs(delta)<=tol&&Math.abs(delta)<scoreY){scoreY=Math.abs(delta);bestY=delta;guideY=e;}}));});
  return {dx:snap(dx+bestX),dy:snap(dy+bestY),guideX,guideY};
}
function rectInSvg(svg,item,color,label,kind,index){
  const k=esc();
  const active=isSelected(kind,index), q=add(document.createElementNS(ns,'rect'),{x:item.x,y:Number(A.largo)-item.y-item.d,width:item.w,height:item.d,fill:color,'fill-opacity':'.42',stroke:active?'#facc15':color,'stroke-width':(active?.16:.08)*k});
  q.style.cursor='move';
  q.addEventListener('pointerdown',e=>{
    if(mode==='erase'){list(kind).splice(index,1);clearSelection();render();e.stopPropagation();return;}
    if(mode==='select'){
      select(kind,index,e.shiftKey); const records=getSelection();
      drag={kind:'move',start:pt(e,svg),records:records.map(r=>({kind:r.kind,index:r.index,x:Number(r.item.x),y:Number(r.item.y)}))};
      q.setPointerCapture(e.pointerId);render();e.stopPropagation();
    }
  });svg.appendChild(q);
  // La etiqueta sólo se dibuja si cabe dentro del rectángulo: en una nave
  // grande con cientos de ubicaciones, los textos se encimaban unos con otros
  // y tapaban el plano en vez de explicarlo.
  const fs=.55*k;
  if(Number(item.w)>fs*Math.max(String(label).length,1)*.42&&Number(item.d)>fs){
    const t=add(document.createElementNS(ns,'text'),{x:Number(item.x)+Number(item.w)/2,y:Number(A.largo)-Number(item.y)-Number(item.d)/2+fs*.35,'text-anchor':'middle','font-size':fs,'pointer-events':'none',fill:'#e5e7eb'});t.textContent=label;svg.appendChild(t);
  }
}
function polygonInSvg(svg,item,index){
  const k=esc();
  const q=add(document.createElementNS(ns,'polygon'),{points:item.poligono.map(p=>`${p.x},${Number(A.largo)-p.y}`).join(' '),fill:'#7c3aed','fill-opacity':'.24',stroke:'#a78bfa','stroke-width':.10*k});
  q.style.cursor='pointer';
  q.addEventListener('pointerdown',e=>{
    if(mode==='erase'){Z.splice(index,1);clearSelection();render();e.stopPropagation();return;}
    if(mode==='select'){select('zone',index,e.shiftKey);render();e.stopPropagation();}
  });
  svg.appendChild(q);
  if(item.nombre){
    const xs=item.poligono.map(p=>p.x),ys=item.poligono.map(p=>p.y);
    const t=add(document.createElementNS(ns,'text'),{x:(Math.min(...xs)+Math.max(...xs))/2,y:Number(A.largo)-(Math.min(...ys)+Math.max(...ys))/2,'text-anchor':'middle','font-size':.7*k,'pointer-events':'none',fill:'#ddd6fe'});
    t.textContent=item.nombre;svg.appendChild(t);
  }
  item.poligono.forEach((p,j)=>{
    const c=add(document.createElementNS(ns,'circle'),{cx:p.x,cy:Number(A.largo)-p.y,r:.20*k,fill:isSelected('zoneVertex',index,j)?'#facc15':'#a78bfa'});
    c.style.cursor='grab';
    c.addEventListener('pointerdown',e=>{
      if(mode==='erase'&&item.poligono.length>3){item.poligono.splice(j,1);clearSelection();render();e.stopPropagation();return;}
      if(mode==='select'){select('zoneVertex',index,e.shiftKey,j);drag={kind:'zoneVertex',index,sub:j};c.setPointerCapture(e.pointerId);render();e.stopPropagation();}
    });
    svg.appendChild(c);
  });
}
function preview(svg,start,end){
  let x=Math.min(start.x,end.x),y=Math.min(start.y,end.y),w=Math.abs(end.x-start.x),d=Math.abs(end.y-start.y);
  if(presetW>0&&presetD>0){x=start.x;y=start.y;w=presetW;d=presetD;}
  let q=svg.querySelector('#cad-preview'),t=svg.querySelector('#cad-preview-label');
  if(!q){q=add(document.createElementNS(ns,'rect'),{id:'cad-preview',fill:'#0f766e','fill-opacity':'.25',stroke:'#2dd4bf','stroke-width':.10*esc(),'stroke-dasharray':`${.18*esc()} ${.12*esc()}`});svg.appendChild(q);t=add(document.createElementNS(ns,'text'),{id:'cad-preview-label','text-anchor':'middle','font-size':.65*esc(),fill:'#e5e7eb','pointer-events':'none'});svg.appendChild(t);}
  q.setAttribute('x',x);q.setAttribute('y',Number(A.largo)-y-d);q.setAttribute('width',w);q.setAttribute('height',d);t.setAttribute('x',x+w/2);t.setAttribute('y',Number(A.largo)-y-d/2);t.textContent=`${w.toFixed(2)} × ${d.toFixed(2)} m`;
  return {x,y,w,d};
}
function inspector(){
  const records=getSelection(), box=document.createElement('div');
  box.className='inspector';box.style.cssText='font:13px sans-serif;padding:10px;background:#0e1623;color:#e5e7eb;border:1px solid #253247;border-radius:6px';
  if(!records.length){box.innerHTML='Selecciona un elemento. Usa <b>Shift + clic</b> para añadir o quitar elementos de la selección.';return box;}
  if(records.length>1){
    box.innerHTML=`<b>${records.length} elementos seleccionados</b> · mover grupo: X <input id="mx" type="number" step="${A.rejilla}" value="0" style="width:75px"> m, Y <input id="my" type="number" step="${A.rejilla}" value="0" style="width:75px"> m <button id="move-group" type="button">Mover</button> <button id="clear-selection" type="button">Quitar selección</button>`;
    box.querySelector('#move-group').onclick=()=>{let dx=snap(Number(box.querySelector('#mx').value)||0),dy=snap(Number(box.querySelector('#my').value)||0);const ajuste=imantar(records.map(r=>({kind:r.kind,index:r.index,item:r.item,x:Number(r.item.x),y:Number(r.item.y)})),dx,dy);records.forEach(r=>{r.item.x=snap(Number(r.item.x)+ajuste.dx);r.item.y=snap(Number(r.item.y)+ajuste.dy);});render();};
    box.querySelector('#clear-selection').onclick=()=>{clearSelection();render();};return box;
  }
  const r=records[0],v=r.item,isVertex=r.kind==='vertex'||r.kind==='zoneVertex';
  const isPolygonZone=r.kind==='zone'&&Array.isArray(v.poligono);
  const tipoOptions=options((A.tipos||[]).map(t=>t.codigo),v.tipo_codigo,'Sin tipo');
  const restriccionTipos=(A.tipos||[]).length?`Tipos admitidos <input id="ptipos" value="${csv(v.tipos).replace(/"/g,'&quot;')}" placeholder="vacío = todos" style="width:150px"><br>`:'';
  const zonaExtra=r.kind==='zone'?`<hr style="border-color:#253247"><b>Reglas de esta zona</b><br>
    Mercancía / zona física <select id="pzf">${options(A.catalogos?.zonas_fisicas,v.zona_fisica,'Libre')}</select><br>
    Estructura <select id="pest"><option value="">Heredar de mercancía</option>${['PISO','RACK'].map(x=>`<option ${String(v.tipo_estructura||'').toUpperCase()===x?'selected':''}>${x}</option>`).join('')}</select>
    ${restriccionTipos}
    Pasillos <select id="ppas"><option value="auto">Probar ambos</option><option value="con" ${v.modo_pasillo==='con'?'selected':''}>Con pasillos</option><option value="sin" ${v.modo_pasillo==='sin'?'selected':''}>Sin pasillos</option></select>
    Ancho <input id="ppw" type="number" min="0" step=".1" value="${Number(v.pasillo_m??3.5)}" style="width:62px"> m<br>
    Orientación <select id="pori"><option value="automatica">Automática</option><option value="horizontal" ${v.orientacion==='horizontal'?'selected':''}>Horizontal</option><option value="vertical" ${v.orientacion==='vertical'?'selected':''}>Vertical</option></select>
    Margen <input id="pmar" type="number" min="0" step=".1" value="${Number(v.margen_m??.5)}" style="width:62px"> m<br>
    <span style="color:#94a3b8">Restricciones opcionales, separadas por coma</span><br>
    Departamentos <input id="pdeps" value="${csv(v.departamentos).replace(/"/g,'&quot;')}" style="width:190px"><br>
    Clases <input id="pcls" value="${csv(v.clases).replace(/"/g,'&quot;')}" style="width:190px"><br>
    Familias <input id="pfams" value="${csv(v.familias).replace(/"/g,'&quot;')}" style="width:190px"><br>
    ABC <input id="pabc" value="${csv(v.abc).replace(/"/g,'&quot;')}" placeholder="A, B, C" style="width:100px">`:'';
  const slotExtra=r.kind==='slot'?`<hr style="border-color:#253247"><b>Reglas de esta localidad</b><br>
    Código WMS <input id="pwms" value="${String(v.codigo_wms||'').replace(/"/g,'&quot;')}" placeholder="opcional" style="width:120px">
    Tipo <select id="ptipo">${tipoOptions}</select><br>
    Departamento <select id="pdep">${options(A.catalogos?.departamentos,v.departamento_reservado,'Libre')}</select><br>
    Clase <select id="pcl">${options(A.catalogos?.clases,v.clase_comercial_reservada,'Libre')}</select><br>
    Familia <select id="pf">${options(A.catalogos?.familias,v.familia_reservada,'Libre')}</select><br>
    ABC <select id="pc">${options(['A','B','C','D','E'],v.clase_abc_reservada,'Libre')}</select>
    <label><input id="pmulti" type="checkbox" ${v.multisku?'checked':''}> Multi-SKU</label>`:'';
  const geometria=isVertex?`X <input id="px" type="number" step="${A.rejilla}" value="${Number(v.x).toFixed(2)}" style="width:75px"> m
    Y <input id="py" type="number" step="${A.rejilla}" value="${Number(v.y).toFixed(2)}" style="width:75px"> m`:
    isPolygonZone?`Nombre <input id="pn" value="${String(v.nombre||'').replace(/"/g,'&quot;')}" style="width:150px"> <span style="color:#94a3b8">Edita su forma arrastrando los vértices.</span>`:
    `Nombre <input id="pn" value="${String(v.nombre||'').replace(/"/g,'&quot;')}" style="width:120px">
    X <input id="px" type="number" step="${A.rejilla}" value="${Number(v.x).toFixed(2)}" style="width:75px"> m
    Y <input id="py" type="number" step="${A.rejilla}" value="${Number(v.y).toFixed(2)}" style="width:75px"> m
    Ancho <input id="pw" type="number" min="0.01" step="${A.rejilla}" value="${Number(v.w).toFixed(2)}" style="width:75px"> m Largo <input id="pd" type="number" min="0.01" step="${A.rejilla}" value="${Number(v.d).toFixed(2)}" style="width:75px"> m`;
  box.innerHTML=`<b>Propiedades — ${isVertex?(r.kind==='zoneVertex'?'vértice de zona':'vértice del perímetro'):r.kind==='slot'?'ubicación':r.kind==='obstacle'?'obstáculo':r.kind==='zone'?'zona':r.kind==='access'?'acceso':'elemento'}</b><br>
    ${geometria}
    ${zonaExtra}${slotExtra}<br><button id="apply-props" type="button">Aplicar cambios</button>`;
  box.querySelector('#apply-props').onclick=()=>{if(isVertex){v.x=snap(Number(box.querySelector('#px').value)||0);v.y=snap(Number(box.querySelector('#py').value)||0);}else{v.nombre=box.querySelector('#pn').value.trim()||v.nombre;if(!isPolygonZone){v.x=snap(Number(box.querySelector('#px').value)||0);v.y=snap(Number(box.querySelector('#py').value)||0);v.w=Math.max(.01,snap(Number(box.querySelector('#pw').value)||.01));v.d=Math.max(.01,snap(Number(box.querySelector('#pd').value)||.01));}if(r.kind==='slot'){v.codigo_wms=box.querySelector('#pwms').value.trim()||null;v.tipo_codigo=box.querySelector('#ptipo').value||null;v.departamento_reservado=box.querySelector('#pdep').value||null;v.familia_reservada=box.querySelector('#pf').value||null;v.clase_comercial_reservada=box.querySelector('#pcl').value||null;v.clase_abc_reservada=box.querySelector('#pc').value||null;v.multisku=box.querySelector('#pmulti').checked;}if(r.kind==='zone'){const split=id=>(box.querySelector(id).value||'').split(',').map(x=>x.trim()).filter(Boolean);v.zona_fisica=box.querySelector('#pzf').value||null;v.tipo_estructura=box.querySelector('#pest').value||null;v.tipos=box.querySelector('#ptipos')?split('#ptipos'):[];v.modo_pasillo=box.querySelector('#ppas').value;v.pasillo_m=Number(box.querySelector('#ppw').value)||0;v.orientacion=box.querySelector('#pori').value;v.margen_m=Number(box.querySelector('#pmar').value)||0;v.departamentos=split('#pdeps');v.clases=split('#pcls');v.familias=split('#pfams');v.abc=split('#pabc');}if(!isPolygonZone){const ajuste=imantar([{kind:r.kind,index:r.index,item:v,x:v.x,y:v.y}],0,0);v.x=snap(v.x+ajuste.dx);v.y=snap(v.y+ajuste.dy);}}render();};
  return box;
}

// Editor de localidades: las figuras se dibujan en Canvas con Konva, pero el
// contrato continúa siendo el mismo JSON métrico que consume Python.
function deep(v){return JSON.parse(JSON.stringify(v));}
function html(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function locSnapshot(){return JSON.stringify(U);}
function locCheckpoint(){const now=locSnapshot();if(locHistory.at(-1)!==now)locHistory.push(now);if(locHistory.length>60)locHistory.shift();locFuture=[];}
function locUndo(){if(!locHistory.length)return;locFuture.push(locSnapshot());U=JSON.parse(locHistory.pop());locSelected=[];renderLocalidades();}
function locRedo(){if(!locFuture.length)return;locHistory.push(locSnapshot());U=JSON.parse(locFuture.pop());locSelected=[];renderLocalidades();}
function tipo(codigo){return (A.tipos||[]).find(t=>String(t.codigo)===String(codigo));}
function presupuestoTipo(codigo){return (A.presupuesto||[]).find(t=>String(t.codigo)===String(codigo))||tipo(codigo)||{};}
