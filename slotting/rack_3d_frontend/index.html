<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const toolbar=document.getElementById('toolbar'),stage=document.getElementById('stage'),canvas=document.getElementById('canvas'),statusEl=document.getElementById('status'),inspector=document.getElementById('inspector'),legend=document.getElementById('legend');
let args={},scene,camera,renderer,controls,content,overlay,initialized=false,mode='global',aisle='1',onlyProblems=false,selectedLocation=null,selectedUnit=null,unitMeshes=[],units=[],manualTouched=false,alternatives={},orientationChoice={},manualDims={};const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),clock=new THREE.Clock();
const COLORS={VALIDA:0x0f766e,MULTISKU:0x0284c7,ALTERNATIVA:0xeab308,ERROR:0xdc2626,EXCESO:0x6d28d9,RESERVA:0xd97706,VACIA:0x475569};
function post(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}function ready(){post('streamlit:componentReady',{apiVersion:1})}function frame(){requestAnimationFrame(()=>post('streamlit:setFrameHeight',{height:document.documentElement.scrollHeight}))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function finite(v,d=0){const n=Number(v);return Number.isFinite(n)?n:d}function uniq(a){return[...new Set(a)]}function hashColor(text){let h=0;for(const c of String(text))h=(h*31+c.charCodeAt(0))>>>0;return new THREE.Color([0x2563eb,0x0f766e,0xd97706,0x7c3aed,0xbe123c,0x0369a1,0x4d7c0f][h%7])}
function init(){renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;scene=new THREE.Scene();scene.background=new THREE.Color(0x07101b);content=new THREE.Group();overlay=new THREE.Group();scene.add(content,overlay,new THREE.HemisphereLight(0xdbeafe,0x111827,2.1));const key=new THREE.DirectionalLight(0xffffff,2.3);key.position.set(12,20,9);scene.add(key);canvas.addEventListener('pointerup',onPick);window.addEventListener('resize',resize);initialized=true;animate()}
function clear(group){while(group.children.length){const c=group.children.pop();c.traverse?.(o=>{o.geometry?.dispose();if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.dispose())}})}}
function resize(){if(!renderer||!camera)return;const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
function makeCamera(bounds={x:10,y:8,z:10}){controls?.dispose();camera=new THREE.PerspectiveCamera(48,1,.02,1000);const span=Math.max(bounds.x,bounds.y,bounds.z,2),target={x:bounds.x/2,y:bounds.y/2,z:bounds.z/2};camera.position.set(target.x+bounds.x*.8+span*.18,target.y+bounds.y*.28,target.z+span*1.15);controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.08;controls.target.set(target.x,target.y,target.z);controls.update();resize()}
function addBox(record,color,opacity=.62){const g=new THREE.BoxGeometry(Math.max(.01,record.w),Math.max(.01,record.h),Math.max(.01,record.d)),m=new THREE.MeshStandardMaterial({color,transparent:opacity<1,opacity,roughness:.7,metalness:.03});const mesh=new THREE.Mesh(g,m);mesh.position.set(record.x+record.w/2,record.z+record.h/2,record.y+record.d/2);mesh.userData.record=record;content.add(mesh);return mesh}
function addSteel(record){const g=new THREE.BoxGeometry(Math.max(.012,record.w),Math.max(.012,record.h),Math.max(.012,record.d)),m=new THREE.MeshStandardMaterial({color:0x94a3b8,roughness:.28,metalness:.82});const mesh=new THREE.Mesh(g,m);mesh.position.set(record.x+record.w/2,record.z+record.h/2,record.y+record.d/2);content.add(mesh);return mesh}
function rackFrame(box,extraLevels=[],extraPosts=[]){const t=Math.max(.025,Math.min(.055,Math.min(box.w,box.d)*.045)),xs=uniq([box.x-t/2,box.x+box.w-t/2,...extraPosts.map(x=>x-t/2)]).sort((a,b)=>a-b),ys=[box.y-t/2,box.y+box.d-t/2],zs=uniq([box.z,box.z+box.h,...extraLevels]).sort((a,b)=>a-b);for(const x of xs)for(const y of ys)addSteel({x,y,z:box.z,w:t,d:t,h:box.h});for(const z of zs){for(const y of ys)addSteel({x:box.x-t/2,y,z:z-t/2,w:box.w+t,d:t,h:t});for(const x of xs)addSteel({x,y:box.y-t/2,z:z-t/2,w:t,d:box.d+t,h:t})}}
function renderRackStructures(rows){const groups=new Map();for(const l of rows){const key=`${l.pasillo}|${l.bahia}|${l.lado}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(l)}for(const group of groups.values()){const minX=Math.min(...group.map(l=>l.x)),maxX=Math.max(...group.map(l=>l.x+l.w)),minY=Math.min(...group.map(l=>l.y)),maxY=Math.max(...group.map(l=>l.y+l.d)),minZ=Math.min(...group.map(l=>l.z)),maxZ=Math.max(...group.map(l=>l.z+l.h)),levels=uniq(group.flatMap(l=>[l.z,l.z+l.h]));rackFrame({x:minX,y:minY,z:minZ,w:maxX-minX,d:maxY-minY,h:maxZ-minZ},levels)}}
function grid(size){const g=new THREE.GridHelper(Math.max(10,size),Math.max(10,Math.ceil(size)),0x334155,0x172033);content.add(g)}
function globalLocations(){const all=args.escena?.localidades||[];return all.filter(l=>(aisle==='ALL'||String(l.pasillo)===String(aisle))&&(!onlyProblems||l.status==='ERROR'))}
function structureLocations(){const all=args.escena?.localidades||[];return all.filter(l=>aisle==='ALL'||String(l.pasillo)===String(aisle))}
function addGlobalMerchandise(rows){for(const l of rows){let offset=0;for(const s of l.skus||[]){if(finite(s.unidades_objetivo)<=0)continue;let w=finite(s.largo_cm)/100,d=finite(s.ancho_cm)/100,h=finite(s.alto_cm)/100;if(w>l.w||d>l.d){if(d<=l.w&&w<=l.d)[w,d]=[d,w]}const fits=w<=l.w+1e-6&&d<=l.d+1e-6&&h<=l.h+1e-6,rec={x:l.x+.025+offset,y:l.y+.025,z:l.z+.025,w,d,h};const mesh=addBox(rec,fits?(s.reserva?0xf59e0b:hashColor(s.sku).getHex()):0xef4444,.9);mesh.userData.record=l;offset+=w+.025}}}
function renderGlobal(){mode='global';clear(content);clear(overlay);unitMeshes=[];selectedUnit=null;const rows=globalLocations();grid(Math.max(args.escena?.ancho||10,args.escena?.largo||10));renderRackStructures(structureLocations());rows.forEach(l=>{const empty=!(l.skus||[]).length;addBox(l,COLORS[l.status]||COLORS.VALIDA,empty?.025:l.rol==='EXCESO'?.08:.22)});addGlobalMerchandise(rows);makeCamera({x:args.escena?.ancho||10,y:args.escena?.altura||8,z:args.escena?.largo||10});statusEl.textContent='Estructura por bahía · mercancía activa en surtido · reserva en niveles superiores';renderToolbar();renderInspector();renderLegend()}
function renderToolbar(){const aisles=uniq((args.escena?.localidades||[]).map(x=>String(x.pasillo))).sort((a,b)=>Number(a)-Number(b));toolbar.innerHTML=`<div class="group"><button id="global" class="${mode==='global'?'active':''}">Almacén 3D</button><button id="lab" class="${mode==='lab'?'active':''}" ${selectedLocation?'':'disabled'}>Laboratorio de localidad</button></div><div class="group"><label>Pasillo <select id="aisle"><option value="ALL" ${aisle==='ALL'?'selected':''}>Todos</option>${aisles.map(x=>`<option ${x===aisle?'selected':''}>${x}</option>`).join('')}</select></label><label><input id="problems" type="checkbox" ${onlyProblems?'checked':''}> Sólo problemas</label></div><div class="group"><button id="fit">Ajustar cámara</button>${mode==='lab'?'<button id="reset-pack">Recalcular acomodo</button>':''}</div>`;toolbar.querySelector('#global').onclick=renderGlobal;toolbar.querySelector('#lab').onclick=()=>selectedLocation&&renderLab();toolbar.querySelector('#aisle').onchange=e=>{aisle=e.target.value;renderGlobal()};toolbar.querySelector('#problems').onchange=e=>{onlyProblems=e.target.checked;renderGlobal()};toolbar.querySelector('#fit').onclick=()=>mode==='lab'?fitLab():renderGlobal();toolbar.querySelector('#reset-pack')?.addEventListener('click',()=>{manualTouched=false;packUnits();renderLabScene()})}
function renderLegend(){legend.innerHTML=`<span><i class="swatch" style="background:#94a3b8"></i>Estructura de bahía</span><span><i class="swatch" style="background:#2563eb"></i>Mercancía activa</span><span><i class="swatch" style="background:#f59e0b"></i>Mercancía de reserva</span><span><i class="swatch" style="background:#0f766e"></i>Localidad válida</span><span><i class="swatch" style="background:#dc2626"></i>No cabe / problema</span><span><i class="swatch" style="background:#475569"></i>Vacía</span>`}
function currentBay(l){return(args.escena?.localidades||[]).filter(x=>x.pasillo===l.pasillo&&x.bahia===l.bahia&&x.lado===l.lado)}
function bayMetrics(l){const rows=currentBay(l),positions=new Map(),levels=new Map();let depth=0;for(const x of rows){positions.set(x.posicion,Math.max(positions.get(x.posicion)||0,finite(x.longitud_cm)));levels.set(x.nivel,Math.max(levels.get(x.nivel)||0,finite(x.altura_cm)));depth=Math.max(depth,finite(x.profundidad_cm))}return{width:[...positions.values()].reduce((a,b)=>a+b,0),depth,levels:[...levels].sort((a,b)=>a[0]-b[0])}}
function bayEditor(l){const m=bayMetrics(l);return `<div class="section"><b>Estructura de la bahía P${String(l.pasillo).padStart(2,'0')} · B${String(l.bahia).padStart(2,'0')} · ${esc(l.lado)}</b><div class="muted">La estructura metálica abarca toda la bahía; las localidades se distribuyen dentro de ella.</div><div class="dim-grid"><label>Frente total<input id="bay-width" type="number" min="1" max="5000" step="1" value="${finite(m.width)}"></label><label>Profundidad<input id="bay-depth" type="number" min="1" max="5000" step="1" value="${finite(m.depth)}"></label></div><div class="muted">Altura útil por nivel</div><div class="level-grid">${m.levels.map(([level,height])=>`<label>N${String(level).padStart(2,'0')}<input data-level="${level}" type="number" min="1" max="5000" step="1" value="${height}"></label>`).join('')}</div><button id="update-bay" style="width:100%">Actualizar bahía completa</button></div>`}
function bindBayEditor(l){inspector.querySelector('#update-bay')?.addEventListener('click',()=>{const width=finite(inspector.querySelector('#bay-width')?.value),depth=finite(inspector.querySelector('#bay-depth')?.value),levels=[...inspector.querySelectorAll('[data-level]')].map(x=>({nivel:finite(x.dataset.level),altura_cm:finite(x.value)})),values=[width,depth,...levels.map(x=>x.altura_cm)];if(!levels.length||Math.min(...values)<=0||Math.max(...values)>5000){statusEl.textContent='Las dimensiones deben estar entre 1 y 5,000 cm.';return}post('streamlit:setComponentValue',{value:{action:'update_bay',localidad_id:l.id,frente_bahia_cm:width,profundidad_cm:depth,niveles:levels},dataType:'json'});statusEl.textContent='Bahía enviada para reconstruir sus posiciones y niveles.'})}
function locDetails(l){return `<h3>${esc(l.id)}</h3><div class="muted">Pasillo ${l.pasillo} · Bahía ${l.bahia} · Lado ${l.lado} · N${String(l.nivel).padStart(2,'0')} · P${String(l.posicion).padStart(2,'0')}</div><div class="section"><b>${esc(l.tipo_codigo)}</b><div>${finite(l.longitud_cm)} × ${finite(l.profundidad_cm)} × ${finite(l.altura_cm)} cm</div><div class="chips"><span class="chip">${esc(l.rol)}</span><span class="chip">${esc(l.status)}</span>${l.multisku?'<span class="chip">Multi-SKU</span>':''}</div></div>${bayEditor(l)}${(l.issues||[]).map(i=>`<div class="issue">${esc(i)}</div>`).join('')}<div class="section"><b>Mercancía</b>${(l.skus||[]).map(s=>`<div class="sku-card"><b>SKU ${esc(s.sku)}</b> · ABC ${esc(s.abc)} · <span class="chip">${s.reserva?'RESERVA':'SURTIDO'}</span><br>${finite(s.largo_cm)}×${finite(s.ancho_cm)}×${finite(s.alto_cm)} cm<br>Existencia total: ${finite(s.existencia)} · Activo total: ${finite(s.unidades_activo,s.existencia)}<br>${s.reserva?'Reserva':'Activo'} en esta localidad: ${finite(s.unidades_objetivo)} · Capacidad: ${finite(s.capacidad)}</div>`).join('')||'<p class="muted">Sin mercancía asignada.</p>'}</div><button id="open-lab" class="primary" ${(l.skus||[]).length?'':'disabled'}>Probar acomodo en esta localidad</button>`}
function renderInspector(){if(mode==='global'){inspector.innerHTML=selectedLocation?locDetails(selectedLocation):'<h3>Explorar asignaciones</h3><p class="muted">Selecciona una localidad para ver su mercancía y configurar la estructura completa de su bahía.</p>';if(selectedLocation)bindBayEditor(selectedLocation);inspector.querySelector('#open-lab')?.addEventListener('click',renderLab);return}renderLabInspector()}
function pointerFrom(e){const r=canvas.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera)}
function onPick(e){pointerFrom(e);const targets=mode==='lab'?unitMeshes:content.children.filter(x=>x.userData?.record);const hits=raycaster.intersectObjects(targets,false);if(!hits.length){if(mode==='lab'){selectedUnit=null;renderLabInspector()}return}if(mode==='global'){const next=hits[0].object.userData.record;if(selectedLocation?.id!==next.id){units=[];manualDims={}}selectedLocation=next;clear(overlay);overlay.add(new THREE.BoxHelper(hits[0].object,0xfacc15));renderInspector()}else{selectedUnit=hits[0].object.userData.unit;renderLabInspector();renderLabScene(false)}}
function bestMode(s,l,forced){const custom=manualDims[String(s.sku)],base=custom?[['manual_3d',custom.w,custom.d,custom.h]]:[['largo_frente',s.largo_cm,s.ancho_cm,s.alto_cm],['ancho_frente',s.ancho_cm,s.largo_cm,s.alto_cm]],modes=base.filter(x=>custom||!forced||forced==='auto'||x[0]===forced);let best=null;for(const[m,w,d,h]of modes){const lanes=Math.floor((l.longitud_cm+1e-6)/(w+finite(args.gap_cm,2))),rows=Math.floor((l.profundidad_cm+1e-6)/(d+finite(args.gap_cm,2))),stacks=Math.floor((l.altura_cm+1e-6)/h),cap=lanes*rows*stacks;if(cap>0&&(!best||cap>best.cap))best={mode:m,w,d,h,lanes,rows,stacks,cap}}return best}
function packUnits(){if(!selectedLocation)return;units=[];selectedUnit=null;const l=selectedLocation,gap=finite(args.gap_cm,2),multi=(l.skus||[]).length>1,hasManual=Object.keys(manualDims).length>0;let laneStart=0,index=0;for(const s of l.skus||[]){const forced=orientationChoice[s.sku]||alternatives[l.id]?.orientaciones?.[s.sku]||'auto',p=bestMode(s,l,forced);if(!p){const w=finite(s.largo_cm),d=finite(s.ancho_cm),h=finite(s.alto_cm);units.push({id:`${s.sku}-${++index}`,sku:String(s.sku),index:1,x_cm:laneStart,y_cm:0,z_cm:0,w_cm:w,d_cm:d,h_cm:h,orientation:'revision_manual',candidateOnly:true,color:hashColor(s.sku).getHex()});laneStart+=w+gap;continue}const lanes=multi?1:p.lanes,cap=lanes*p.rows*p.stacks,total=Math.min(finite(s.unidades_objetivo,finite(s.unidades_activo,s.existencia)),cap,240-units.length);for(let n=0;n<total;n++){const lane=Math.floor(n/(p.rows*p.stacks)),rem=n%(p.rows*p.stacks),row=Math.floor(rem/p.stacks),stack=rem%p.stacks;units.push({id:`${s.sku}-${++index}`,sku:String(s.sku),index:n+1,x_cm:laneStart+lane*(p.w+gap),y_cm:row*(p.d+gap),z_cm:stack*p.h,w_cm:p.w,d_cm:p.d,h_cm:p.h,orientation:p.mode,color:hashColor(s.sku).getHex()})}laneStart+=lanes*(p.w+gap);orientationChoice[s.sku]=p.mode}manualTouched=hasManual;validateUnits()}
function validateUnits(){const l=selectedLocation,gap=finite(args.gap_cm,0);let bad=0;for(const u of units)u.problem=false;for(let i=0;i<units.length;i++){const a=units[i];if(a.x_cm<0||a.y_cm<0||a.z_cm<0||a.x_cm+a.w_cm>l.longitud_cm+1e-6||a.y_cm+a.d_cm>l.profundidad_cm+1e-6||a.z_cm+a.h_cm>l.altura_cm+1e-6){a.problem=true;bad++}for(let j=0;j<i;j++){const b=units[j],over=a.x_cm<b.x_cm+b.w_cm+gap-1e-6&&a.x_cm+a.w_cm+gap>b.x_cm+1e-6&&a.y_cm<b.y_cm+b.d_cm+gap-1e-6&&a.y_cm+a.d_cm+gap>b.y_cm+1e-6&&a.z_cm<b.z_cm+b.h_cm-1e-6&&a.z_cm+a.h_cm>b.z_cm+1e-6;if(over){if(!a.problem)bad++;a.problem=true;b.problem=true}}}return bad}
function missingSkuCount(){const present=new Set(units.map(u=>String(u.sku)));return(selectedLocation?.skus||[]).filter(s=>!present.has(String(s.sku))).length}
function renderLab(){mode='lab';if(!units.length)packUnits();renderLabScene();renderToolbar();renderInspector();renderLegend()}
function renderLabScene(resetCamera=true){clear(content);clear(overlay);unitMeshes=[];const l=selectedLocation;const box={x:0,y:0,z:0,w:l.longitud_cm/100,d:l.profundidad_cm/100,h:l.altura_cm/100};grid(Math.max(2,box.w*2));const container=new THREE.Mesh(new THREE.BoxGeometry(box.w,box.h,box.d),new THREE.MeshBasicMaterial({color:0x22c55e,transparent:true,opacity:.075,depthWrite:false,side:THREE.DoubleSide}));container.position.set(box.w/2,box.h/2,box.d/2);content.add(container);for(const u of units){const rec={x:u.x_cm/100,y:u.y_cm/100,z:u.z_cm/100,w:u.w_cm/100,d:u.d_cm/100,h:u.h_cm/100};const mesh=addBox(rec,u.problem?0xef4444:u.color,.78);mesh.userData.unit=u;unitMeshes.push(mesh);if(selectedUnit?.id===u.id)overlay.add(new THREE.BoxHelper(mesh,0xfacc15))}if(resetCamera)fitLab();const bad=validateUnits(),missing=missingSkuCount(),candidates=units.filter(u=>u.candidateOnly).length;statusEl.textContent=`${units.length} piezas representadas · ${candidates?candidates+' por revisar manualmente':bad?bad+' con conflicto':missing?missing+' SKU sin acomodo':'acomodo válido'} · clic para seleccionar una pieza`;renderLabInspector()}
function fitLab(){const l=selectedLocation;makeCamera({x:l.longitud_cm/100,y:l.altura_cm/100,z:l.profundidad_cm/100})}
function rotateSelected(a,b){if(!selectedUnit)return;[selectedUnit[a],selectedUnit[b]]=[selectedUnit[b],selectedUnit[a]];selectedUnit.orientation='revision_manual';manualTouched=true;validateUnits();renderLabScene(false)}
function renderLabInspector(){const l=selectedLocation;if(!l)return;const bad=validateUnits(),missing=missingSkuCount(),candidates=units.filter(u=>u.candidateOnly).length,invalid=bad+missing+candidates;inspector.innerHTML=`<h3>Laboratorio · ${esc(l.id)}</h3><div class="muted">El área verde es el volumen útil de la localidad; la estructura metálica sólo se muestra por bahía en Almacén 3D.</div><div class="section"><label>SKU activo <select id="active-sku">${(l.skus||[]).map(s=>`<option>${esc(s.sku)}</option>`).join('')}</select></label><div class="lab-buttons"><button data-mode="auto">Automático</button><button data-mode="largo_frente">Largo al frente</button><button data-mode="ancho_frente">Ancho al frente</button></div></div>${selectedUnit?`<div class="section"><b>Unidad ${esc(selectedUnit.index)} · SKU ${esc(selectedUnit.sku)}</b>${selectedUnit.candidateOnly?'<div class="issue">El motor no encontró acomodo. La pieza se mantiene visible para comprobarla manualmente.</div>':''}<div>${finite(selectedUnit.w_cm)}×${finite(selectedUnit.d_cm)}×${finite(selectedUnit.h_cm)} cm</div><div>X ${finite(selectedUnit.x_cm).toFixed(1)} · Fondo ${finite(selectedUnit.y_cm).toFixed(1)} · Z ${finite(selectedUnit.z_cm).toFixed(1)} cm</div><div class="lab-buttons"><button id="rotate-floor">Girar en piso</button><button id="rotate-wh">Frente ↔ altura</button><button id="rotate-dh">Fondo ↔ altura</button></div><button id="replicate" style="margin-top:6px;width:100%">Probar esta orientación en todas las piezas</button><div class="move-pad"><span></span><button data-move="y+">↑</button><span></span><button data-move="x-">←</button><button data-move="y-">↓</button><button data-move="x+">→</button></div><label>Paso <input id="step" type="number" min=".5" step=".5" value="1" style="width:70px"> cm</label></div>`:'<div class="section muted">Selecciona una pieza para girarla sobre cualquiera de sus tres ejes o desplazarla.</div>'}<div class="section"><div class="${invalid?'bad':'ok'}">${candidates?candidates+' pieza(s) requieren comprobación manual y replicar una orientación.':bad?bad+' piezas presentan colisión o salen de la localidad.':missing?missing+' SKU asignados no tienen una unidad representada.':'La alternativa actual es geométricamente válida.'}</div>${units.length>=240?'<div class="issue">Vista limitada a 240 piezas; usa una orientación automática para validar la capacidad completa.</div>':''}<button id="apply-alt" class="primary" ${invalid||units.length>=240?'disabled':''} style="margin-top:8px;width:100%">Aplicar alternativa válida</button></div>`;const active=inspector.querySelector('#active-sku');inspector.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{delete manualDims[active.value];orientationChoice[active.value]=b.dataset.mode;manualTouched=false;packUnits();renderLabScene()});inspector.querySelector('#rotate-floor')?.addEventListener('click',()=>rotateSelected('w_cm','d_cm'));inspector.querySelector('#rotate-wh')?.addEventListener('click',()=>rotateSelected('w_cm','h_cm'));inspector.querySelector('#rotate-dh')?.addEventListener('click',()=>rotateSelected('d_cm','h_cm'));inspector.querySelector('#replicate')?.addEventListener('click',()=>{manualDims[String(selectedUnit.sku)]={w:selectedUnit.w_cm,d:selectedUnit.d_cm,h:selectedUnit.h_cm};orientationChoice[String(selectedUnit.sku)]='manual_3d';packUnits();renderLabScene()});inspector.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const step=finite(inspector.querySelector('#step')?.value,1),dir=b.dataset.move;if(dir==='x-')selectedUnit.x_cm-=step;if(dir==='x+')selectedUnit.x_cm+=step;if(dir==='y-')selectedUnit.y_cm-=step;if(dir==='y+')selectedUnit.y_cm+=step;manualTouched=true;validateUnits();renderLabScene(false)});inspector.querySelector('#apply-alt').onclick=()=>{const payload={localidad_id:l.id,orientaciones:{...orientationChoice}};if(manualTouched)payload.unidades_manuales=units.map(({color,problem,candidateOnly,...u})=>u);alternatives={...alternatives,[l.id]:payload};post('streamlit:setComponentValue',{value:payload,dataType:'json'});statusEl.textContent='Alternativa enviada para revalidación.'}}
function animate(){requestAnimationFrame(animate);controls?.update(clock.getDelta());renderer?.render(scene,camera)}
window.addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;args=e.data.args||{};alternatives=args.alternativas||{};if(!initialized)init();const rows=args.escena?.localidades||[];aisle=rows.length?String(rows[0].pasillo):'ALL';selectedLocation=null;units=[];orientationChoice={};manualDims={};renderGlobal();frame()});ready();
</script></body></html>
