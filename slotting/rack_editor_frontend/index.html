<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e5edf7;background:#07101b}
*{box-sizing:border-box}body{margin:0;background:#07101b}button,input,select{font:inherit;color:inherit}
button,select,input{border:1px solid #2a3b50;background:#0e1a29;border-radius:7px;padding:7px 9px}
button{cursor:pointer}button:hover{border-color:#38bdf8}.primary{background:#0369a1;border-color:#0ea5e9}
.shell{padding:10px}.toolbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
.field{display:grid;gap:4px;font-size:12px;color:#94a3b8}.field input,.field select{min-width:92px;color:#e5edf7}
.layout{display:grid;grid-template-columns:minmax(540px,1fr) 285px;gap:12px}.canvas,.inspector{border:1px solid #243449;border-radius:10px;background:#0a1421;padding:12px}
.rack-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.muted{color:#8fa0b5;font-size:12px}
.rack{display:grid;gap:4px;align-items:stretch;min-height:520px}.corner,.level-label,.cell{border:1px solid #283a50;border-radius:6px;min-width:70px;overflow:hidden}
.corner,.level-label{display:flex;align-items:center;justify-content:center;background:#101d2c;color:#b9c8d8;font-size:12px;font-weight:650}
.cell{position:relative;padding:7px;background:#101d2c;text-align:left;min-height:64px;cursor:pointer}
.cell:hover,.cell.selected{outline:2px solid #38bdf8;outline-offset:-2px}.cell.pick{background:linear-gradient(145deg,#0d3b49,#102738)}
.cell.reserve{background:linear-gradient(145deg,#31245a,#1e2440)}.cell.error{background:linear-gradient(145deg,#542121,#2b1921)}
.cell.empty{background:#0a111c;border-style:dashed;color:#64748b}.cell-code{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-meta{font-size:10px;color:#aab8c7;margin-top:5px}.chips{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}.chip{background:#172b3d;color:#bae6fd;border:1px solid #27536a;border-radius:999px;padding:1px 5px;font-size:9px}
.badge{position:absolute;right:5px;top:5px;border-radius:999px;padding:1px 5px;font-size:9px;background:#075985;color:#e0f2fe}.badge.reserve{background:#5b21b6}
.inspector h3{margin:0 0 4px;font-size:16px}.section{border-top:1px solid #223247;margin-top:12px;padding-top:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.wide{grid-column:1/-1}.sku-list{max-height:150px;overflow:auto;margin:7px 0;display:grid;gap:4px}.sku-row{display:flex;justify-content:space-between;align-items:center;background:#101d2c;border-radius:6px;padding:5px 7px;font-size:12px}.sku-row button{padding:2px 6px}
.empty-note{display:flex;align-items:center;justify-content:center;min-height:520px;color:#64748b}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:#94a3b8}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.inspector{order:-1}}
</style>
</head>
<body><div id="root"></div>
<script>
const root=document.getElementById('root');let args={},locations=[],levels=[],types=[],skus=[],selected=null,deleted=[],filters={aisle:null,bay:null,side:'I'};
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function ready(){send('streamlit:componentReady',{apiVersion:1})}function height(){send('streamlit:setFrameHeight',{height:Math.max(740,document.body.scrollHeight)})}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function uniq(a){return [...new Set(a)]}function current(){return locations.find(x=>x.id===selected)}
function face(){return locations.filter(x=>Number(x.pasillo)===Number(filters.aisle)&&Number(x.bahia)===Number(filters.bay)&&x.lado===filters.side)}
function emit(){send('streamlit:setComponentValue',{value:{localidades:locations.map(x=>({...x,parsed:undefined,status:undefined})),niveles:levels,eliminadas:[...deleted]},dataType:'json'})}
function formatId(base,level,pos){return `${base.area||'RA'}-P${String(base.pasillo).padStart(2,'0')}-B${String(base.bahia).padStart(2,'0')}-L${base.lado}-N${String(level).padStart(2,'0')}-P${String(pos).padStart(2,'0')}`}
function initializeFilters(){const valid=locations.filter(x=>x.parsed!==false&&Number(x.pasillo));if(!valid.length)return;if(filters.aisle==null||!valid.some(x=>Number(x.pasillo)===Number(filters.aisle)))filters.aisle=Number(valid[0].pasillo);const aisleLoc=valid.filter(x=>Number(x.pasillo)===Number(filters.aisle));if(filters.bay==null||!aisleLoc.some(x=>Number(x.bahia)===Number(filters.bay)))filters.bay=Number(aisleLoc[0].bahia);if(!aisleLoc.some(x=>x.lado===filters.side))filters.side=aisleLoc[0].lado}
function optionList(values,currentValue){return values.map(v=>`<option value="${esc(v)}" ${String(v)===String(currentValue)?'selected':''}>${esc(v)}</option>`).join('')}
function renderInspector(){const loc=current();if(!loc)return `<aside class="inspector"><h3>Selecciona una localidad</h3><p class="muted">Edita dimensiones, tipo y contenido desde la elevación frontal.</p></aside>`;const level=levels.find(x=>Number(x.nivel)===Number(loc.nivel))||{};return `<aside class="inspector"><h3>${esc(loc.id)}</h3><div class="muted">${loc.rol} · ${loc.generada?'Generada':'Importada'} · ${loc.skus?.length||0} SKU</div>
<div class="section grid2"><label class="field wide">Tipo de localidad<select id="i-type">${types.map(t=>`<option value="${esc(t.tipo_codigo)}" ${t.tipo_codigo===loc.tipo_codigo?'selected':''}>${esc(t.tipo_codigo)} · ${esc(t.descripcion||'')}</option>`).join('')}</select></label>
<label class="field">Frente (cm)<input id="i-width" type="number" min="1" step="1" value="${Number(loc.longitud_cm||0)}"></label><label class="field">Profundidad (cm)<input id="i-depth" type="number" min="1" step="1" value="${Number(loc.profundidad_cm||0)}"></label><label class="field wide">Altura útil (cm)<input id="i-height" type="number" min="1" step="1" value="${Number(loc.altura_cm||0)}"></label><label class="field wide"><span><input id="i-multi" type="checkbox" ${loc.multisku?'checked':''}> Permitir Multi-SKU</span></label></div>
<div class="section"><b>Contenido propuesto</b><div class="sku-list">${(loc.skus||[]).map(s=>`<div class="sku-row"><span>${esc(s)}</span><button data-remove-sku="${esc(s)}">Quitar</button></div>`).join('')||'<span class="muted">Sin SKU asignados.</span>'}</div><label class="field">Agregar SKU<input id="sku-search" list="sku-options" placeholder="Escribe o selecciona código"><datalist id="sku-options">${skus.slice(0,5000).map(s=>`<option value="${esc(s.sku)}">${esc(s.tipo_codigo||'')}</option>`).join('')}</datalist></label><button id="add-sku" style="margin-top:7px">Agregar</button></div>
<div class="section grid2"><label class="field">Rol del nivel<select id="level-role"><option ${level.rol==='SURTIDO'?'selected':''}>SURTIDO</option><option ${level.rol==='EXCESO'?'selected':''}>EXCESO</option></select></label><label class="field">Acceso<select id="level-access"><option ${level.acceso==='MANUAL'?'selected':''}>MANUAL</option><option ${level.acceso==='EQUIPO'?'selected':''}>EQUIPO</option></select></label><label class="field wide">Altura del nivel (cm)<input id="level-height" type="number" min="1" value="${Number(level.altura_util_cm||loc.altura_cm||0)}"></label></div>
<div class="section"><button id="save" class="primary">Aplicar ajustes</button></div></aside>`}
function bindInspector(){const loc=current();if(!loc)return;document.querySelectorAll('[data-remove-sku]').forEach(b=>b.onclick=()=>{loc.skus=(loc.skus||[]).filter(s=>s!==b.dataset.removeSku);loc.multisku=loc.skus.length>1;render()});document.getElementById('add-sku').onclick=()=>{const v=document.getElementById('sku-search').value.trim();if(v&&skus.some(x=>String(x.sku)===v)){loc.skus=uniq([...(loc.skus||[]),v]);loc.multisku=loc.skus.length>1;render()}};document.getElementById('i-type').onchange=e=>{const spec=types.find(t=>t.tipo_codigo===e.target.value);if(spec){document.getElementById('i-width').value=Number(spec.longitud_cm);document.getElementById('i-depth').value=Number(spec.profundidad_cm)}};document.getElementById('save').onclick=()=>{const newType=document.getElementById('i-type').value;loc.tipo_codigo=newType;loc.longitud_cm=Number(document.getElementById('i-width').value);loc.profundidad_cm=Number(document.getElementById('i-depth').value);loc.altura_cm=Number(document.getElementById('i-height').value);loc.multisku=document.getElementById('i-multi').checked;const lev=levels.find(x=>Number(x.nivel)===Number(loc.nivel));if(lev){lev.rol=document.getElementById('level-role').value;lev.acceso=document.getElementById('level-access').value;lev.altura_util_cm=Number(document.getElementById('level-height').value);locations.filter(x=>Number(x.nivel)===Number(lev.nivel)).forEach(x=>{x.rol=lev.rol;x.acceso=lev.acceso;x.altura_cm=lev.altura_util_cm})}emit();render()}}
function addPosition(){const f=face(),base=f[0];if(!base)return;const pos=Math.max(0,...f.map(x=>Number(x.posicion)))+1;for(const lev of levels){const spec=types.find(t=>t.tipo_codigo===(base.tipo_codigo||types[0]?.tipo_codigo))||{};locations.push({...base,id:formatId(base,lev.nivel,pos),nivel:Number(lev.nivel),posicion:pos,rol:lev.rol,acceso:lev.acceso,altura_cm:Number(lev.altura_util_cm||spec.altura_cm||base.altura_cm),longitud_cm:Number(spec.longitud_cm||base.longitud_cm),profundidad_cm:Number(spec.profundidad_cm||base.profundidad_cm),skus:[],multisku:false,generada:true,parsed:true})}selected=formatId(base,levels[0].nivel,pos);emit();render()}
function removePosition(){const loc=current();if(!loc)return;const doomed=locations.filter(x=>Number(x.pasillo)===Number(loc.pasillo)&&Number(x.bahia)===Number(loc.bahia)&&x.lado===loc.lado&&Number(x.posicion)===Number(loc.posicion));if(doomed.some(x=>(x.skus||[]).length)){alert('Retira primero los SKU de esta posición.');return}const ids=new Set(doomed.map(x=>x.id));deleted=uniq([...deleted,...ids]);locations=locations.filter(x=>!ids.has(x.id));selected=null;emit();render()}
function render(){initializeFilters();const aisles=uniq(locations.filter(x=>x.parsed!==false).map(x=>Number(x.pasillo))).sort((a,b)=>a-b),bays=uniq(locations.filter(x=>Number(x.pasillo)===Number(filters.aisle)).map(x=>Number(x.bahia))).sort((a,b)=>a-b),sides=uniq(locations.filter(x=>Number(x.pasillo)===Number(filters.aisle)&&Number(x.bahia)===Number(filters.bay)).map(x=>x.lado)).sort();const f=face(),positions=uniq(f.map(x=>Number(x.posicion))).sort((a,b)=>a-b),levs=[...levels].sort((a,b)=>Number(b.nivel)-Number(a.nivel));let cells=`<div class="corner">Nivel</div>${positions.map(p=>`<div class="corner">P${String(p).padStart(2,'0')}</div>`).join('')}`;for(const lev of levs){cells+=`<div class="level-label">N${String(lev.nivel).padStart(2,'0')}<br>${esc(lev.rol)}</div>`;for(const pos of positions){const loc=f.find(x=>Number(x.nivel)===Number(lev.nivel)&&Number(x.posicion)===pos);if(!loc){cells+='<div class="cell empty">No generada</div>';continue}const cls=loc.status==='ERROR'?'error':lev.rol==='EXCESO'?'reserve':'pick';cells+=`<button class="cell ${cls} ${selected===loc.id?'selected':''}" data-id="${esc(loc.id)}"><span class="cell-code">${esc(loc.tipo_codigo)}</span>${loc.skus?.length>1?`<span class="badge">M${loc.skus.length}</span>`:lev.rol==='EXCESO'?'<span class="badge reserve">EXC</span>':''}<div class="chips">${(loc.skus||[]).slice(0,4).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}${(loc.skus||[]).length>4?`<span class="chip">+${loc.skus.length-4}</span>`:''}</div><div class="cell-meta">${Number(loc.longitud_cm)}×${Number(loc.profundidad_cm)}×${Number(loc.altura_cm)} cm</div></button>`}}
root.innerHTML=`<div class="shell"><div class="toolbar"><label class="field">Pasillo<select id="aisle">${optionList(aisles,filters.aisle)}</select></label><label class="field">Bahía<select id="bay">${optionList(bays,filters.bay)}</select></label><label class="field">Lado<select id="side">${optionList(sides,filters.side)}</select></label><button id="add-position">+ Posición</button><button id="remove-position">Eliminar posición</button></div><div class="layout"><main class="canvas"><div class="rack-title"><div><b>Elevación frontal</b><div class="muted">Pasillo ${filters.aisle} · Bahía ${filters.bay} · Lado ${filters.side}</div></div><div class="muted">Selecciona una celda para editarla</div></div>${positions.length?`<div class="rack" style="grid-template-columns:88px repeat(${positions.length},minmax(92px,1fr));grid-template-rows:34px repeat(${levs.length},minmax(72px,1fr))">${cells}</div>`:'<div class="empty-note">No hay posiciones en esta cara.</div>'}<div class="legend"><span><i class="dot" style="background:#0d3b49"></i>Surtido</span><span><i class="dot" style="background:#31245a"></i>Exceso</span><span><i class="dot" style="background:#542121"></i>Requiere ajuste</span></div></main>${renderInspector()}</div></div>`;
document.getElementById('aisle').onchange=e=>{filters.aisle=Number(e.target.value);filters.bay=null;selected=null;render()};document.getElementById('bay').onchange=e=>{filters.bay=Number(e.target.value);selected=null;render()};document.getElementById('side').onchange=e=>{filters.side=e.target.value;selected=null;render()};document.getElementById('add-position').onclick=addPosition;document.getElementById('remove-position').onclick=removePosition;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()});bindInspector();height()}
window.addEventListener('message',e=>{if(e.data.type==='streamlit:render'){args=e.data.args||{};locations=(args.localidades||[]).map(x=>({...x,skus:[...(x.skus||[])]}));levels=(args.niveles||[]).map(x=>({...x}));types=(args.tipos||[]).map(x=>({...x}));skus=(args.skus||[]).map(x=>({...x}));deleted=[];render()}});ready();
</script></body></html>
